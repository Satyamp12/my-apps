<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satyam Store</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b3d2e 0%, #115e43 50%, #062b20 100%);
            min-height: 100vh;
            padding: 30px 16px 40px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Clean Header without Photo */
        .store-header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 28px 18px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .store-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .store-header p {
            font-size: 13px;
            color: #d1fae5;
            opacity: 0.9;
        }

        /* Section Title */
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #a7f3d0;
            margin-bottom: 14px;
            padding-left: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Play Store Style Cards */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .store-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .store-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Card Icons */
        .item-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            flex-shrink: 0;
        }

        .icon-findhub {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .icon-linkedin {
            background: linear-gradient(135deg, #0077b5, #004182);
        }

        .icon-image {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        /* Details */
        .item-details h3 {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .item-details .subtitle {
            font-size: 12px;
            color: #a7f3d0;
            margin-bottom: 4px;
        }

        .item-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #e2e8f0;
        }

        .item-meta span {
            background: rgba(255, 255, 255, 0.12);
            padding: 2px 7px;
            border-radius: 6px;
        }

        /* Buttons */
        .btn-action {
            background: #2ecc71;
            color: #062b20;
            text-decoration: none;
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.35);
            transition: 0.2s all ease;
        }

        .btn-action:active {
            transform: scale(0.94);
            background: #27ae60;
        }

        footer {
            margin-top: 35px;
            text-align: center;
            font-size: 12px;
            color: #6ee7b7;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header (Photo Removed) -->
        <div class="store-header">
            <h1>Welcome to Satyam Store</h1>
            <p>Download verified apps & files below</p>
        </div>

        <!-- Section Title -->
        <div class="section-title">Available Downloads</div>

        <!-- List -->
        <div class="items-list">
            
            <!-- App 1: Find Hub -->
            <div class="store-card">
                <div class="item-info">
                    <div class="item-icon icon-findhub">🔍</div>
                    <div class="item-details">
                        <h3>Find Hub</h3>
                        <div class="subtitle">Satyam Apps • Utility</div>
                        <div class="item-meta">
                            <span>4.8 ★</span>
                            <span>APK</span>
                        </div>
                    </div>
                </div>
                <a href="FindHub.apk" download class="btn-action">Install</a>
            </div>

            <!-- App 2: LinkedIn Android -->
            <div class="store-card">
                <div class="item-info">
                    <div class="item-icon icon-linkedin">in</div>
                    <div class="item-details">
                        <h3>LinkedIn Android</h3>
                        <div class="subtitle">Professional Network</div>
                        <div class="item-meta">
                            <span>4.5 ★</span>
                            <span>APK</span>
                        </div>
                    </div>
                </div>
                <a href="Linkdinandroid.apk" download class="btn-action">Install</a>
            </div>

            <!-- Item 3: Profile Image Download (No Photo Shown) -->
            <div class="store-card">
                <div class="item-info">
                    <div class="item-icon icon-image">🖼️</div>
                    <div class="item-details">
                        <h3>Image Download</h3>
                        <div class="subtitle">Profile Asset • Media</div>
                        <div class="item-meta">
                            <span>HD</span>
                            <span>PNG</span>
                        </div>
                    </div>
                </div>
                <a href="Patel.jpg.png" download="Profile_Image.png" class="btn-action">Download</a>
            </div>

        </div>

        <footer>
            © Satyam Store • All Rights Reserved
        </footer>
    </div>

</body>
</html>
