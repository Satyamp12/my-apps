<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satyam Store</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.6;
        }

        /* Chat Widget Styles */
        .chat-toggle-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #4f46e5);
            color: #fff;
            border: none;
            outline: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            z-index: 9999;
            transition: transform 0.2s ease;
        }

        .chat-toggle-btn:hover {
            transform: scale(1.08);
        }

        .ai-chat-widget {
            position: fixed;
            bottom: 95px;
            right: 25px;
            width: 360px;
            max-width: 90vw;
            height: 520px;
            max-height: 80vh;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 9999;
        }

        .ai-chat-widget.active {
            display: flex;
        }

        .chat-header {
            background-color: #0f172a;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: #38bdf8;
            font-size: 0.95rem;
        }

        .chat-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .chat-close-btn:hover {
            color: #fff;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background-color: #4f46e5;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .bot-msg {
            align-self: flex-start;
            background-color: #334155;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            background-color: #0f172a;
            border-top: 1px solid #334155;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .chat-input-area input:focus {
            border-color: #38bdf8;
        }

        .chat-send-btn {
            background-color: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            cursor: pointer;
            font-weight: 500;
        }

        .chat-send-btn:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-store"></i> Satyam Store</div>
    </header>

    <main>
        <h1>Satyam Store mein Aapka Swagat Hai</h1>
        <p>Aapka shopping experience aasan banane ke liye hamara AI assistant tayyar hai. Neeche diye gaye sparkle button par click karke baat karein!</p>
    </main>

    <!-- Chat Trigger Button -->
    <button class="chat-toggle-btn" id="chat-toggle-btn" title="AI Assistant">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
    </button>

    <!-- AI Chatbot Box -->
    <div class="ai-chat-widget" id="ai-chat-widget">
        <div class="chat-header">
            <div class="chat-header-title">
                <i class="fa-solid fa-sparkles"></i>
                <span>Google Gemini AI</span>
            </div>
            <button class="chat-close-btn" id="chat-close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message bot-msg">Namaste! Main Satyam Store ka AI assistant hoon. Main aapki kya sahayata kar sakta hoon?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Kuchh bhi poochhein (Hindi ya English)...">
            <button class="chat-send-btn" id="chat-send-btn">Send</button>
        </div>
    </div>

    <!-- Firebase App Configuration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAexoUO9KNzm0rEpoI0RNyN9yOFJ-BfvN0",
            authDomain: "satyam-store-4e40c.firebaseapp.com",
            projectId: "satyam-store-4e40c",
            storageBucket: "satyam-store-4e40c.appspot.com",
            messagingSenderId: "788869658650",
            appId: "1:788869658650:web:44c5b369e8b792e3d368e7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
    </script>

    <!-- Gemini AI Chatbot Logic -->
    <script>
        const GEMINI_API_KEY = "AIzaSyAexoUO9KNzm0rEpoI0RNyN9yOFJ-BfvN0";

        const chatWidget = document.getElementById('ai-chat-widget');
        const chatToggleBtn = document.getElementById('chat-toggle-btn');
        const chatCloseBtn = document.getElementById('chat-close-btn');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const chatSendBtn = document.getElementById('chat-send-btn');

        // Toggle Chatbox
        if (chatToggleBtn && chatWidget) {
            chatToggleBtn.addEventListener('click', () => {
                chatWidget.classList.toggle('active');
                if (chatWidget.classList.contains('active')) {
                    chatInput.focus();
                }
            });
        }

        if (chatCloseBtn && chatWidget) {
            chatCloseBtn.addEventListener('click', () => {
                chatWidget.classList.remove('active');
            });
        }

        // Helper to append message
        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' ? 'message user-msg' : 'message bot-msg';
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msgDiv;
        }

        // Call Gemini 1.5 Flash API
        async function sendMessage() {
            const userText = chatInput.value.trim();
            if (!userText) return;

            appendMessage('user', userText);
            chatInput.value = '';

            const typingIndicator = appendMessage('bot', 'Soch raha hoon...');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `You are the polite and helpful customer assistant for 'Satyam Store', an online shopping store. Assist the customer efficiently. Respond in the language used by user (Hindi/Hinglish/English). User says: ${userText}`
                            }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    typingIndicator.textContent = `Error: ${data.error.message}`;
                } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                    typingIndicator.textContent = data.candidates[0].content.parts[0].text;
                } else {
                    typingIndicator.textContent = "Maaf kijiye, koi response nahi mila. Kripya dubara try karein.";
                }
            } catch (error) {
                typingIndicator.textContent = "Network error. Kripya connection check karein.";
            }
        }

        if (chatSendBtn) {
            chatSendBtn.addEventListener('click', sendMessage);
        }

        if (chatInput) {
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        }
    </script>
</body>
</html>
